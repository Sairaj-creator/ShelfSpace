name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shelfspace
          POSTGRES_PASSWORD: shelfspace_password
          POSTGRES_DB: shelfspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint --if-present

    - name: Setup Prisma & Database
      run: |
        npx prisma generate
        npx prisma migrate dev --name init
      env:
        DATABASE_URL: postgresql://shelfspace:shelfspace_password@localhost:5432/shelfspace?schema=public

    - name: Run Tests
      run: npm test
      env:
        DATABASE_URL: postgresql://shelfspace:shelfspace_password@localhost:5432/shelfspace?schema=public
