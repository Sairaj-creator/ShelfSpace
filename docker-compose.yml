version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelfspace
      POSTGRES_PASSWORD: shelfspace_password
      POSTGRES_DB: shelfspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=postgresql://shelfspace:shelfspace_password@postgres:5432/shelfspace?schema=public
      - PORT=3000
      - JWT_SECRET
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PRO_PRICE_ID
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app/apps/api
    depends_on:
      - postgres
      - redis
    command: npm run dev

volumes:
  postgres_data:
