version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelfspace
      POSTGRES_PASSWORD: shelfspace_password
      POSTGRES_DB: shelfspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=postgresql://shelfspace:shelfspace_password@postgres:5432/shelfspace?schema=public
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app/apps/api
    depends_on:
      - postgres
    command: npm run dev

volumes:
  postgres_data:
